name: 🚀 Deploy React 


on:
  push:
    branches: 
     - master
     - dev
     - dev*

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/master' && 'PROD' || 'DEV' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install
        working-directory:  ./kobflow.LogManager 

      - name: Install dependencies
        run: npm ci
        working-directory:  ./kobflow.LogManager 

      - name: Build React app
        run: npm run build -- --mode ${{ vars.VITE_ENV_MODE }}
        working-directory:  ./kobflow.LogManager 

      - name: Clean target folder
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: rm -rf ${{ vars.ENV_DIR }}/*

      - name: Deploy to server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}   # or use password
          source: "kobflow.LogManager/dist/"
          target: "${{ vars.ENV_DIR }}"

      - name: Flatten build folder on server
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ vars.ENV_DIR }}
            # Move built files from kobflow.LogManager/dist into the root
            if [ -d "kobflow.LogManager/dist" ]; then
              mv kobflow.LogManager/dist/* .
              rm -rf kobflow.LogManager
            fi